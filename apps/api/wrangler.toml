name = "quest-api"
main = "src/index.ts"
compatibility_date = "2024-05-01"
compatibility_flags = ["nodejs_compat"]

# One Buffer implementation for the whole bundle. Anchor's decoder rejects
# buffers created by a second copy ("variant mismatch").
[alias]
"buffer" = "./node_modules/buffer/index.js"

[vars]
ENVIRONMENT = "development"
QUEST_PROGRAM_ID = "JDWcp8gXX4sypdDc9h8zHVMjM9nTSWxfY16ThnsS7BLM"
QUEST_MINT = "DV1RyE7yrujJd1pzN9ccekCTpDfYiUuxdguqRkxCu63m"
R2_BUCKET_NAME = "quest-media"
R2_PUBLIC_URL = "https://media.quest.gg"

# R2 Bucket
[[r2_buckets]]
binding = "R2"
bucket_name = "quest-media"

# Queue for verification pipeline
[[queues.producers]]
binding = "VERIFICATION_QUEUE"
queue = "quest-verification"

[[queues.consumers]]
queue = "quest-verification"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 2

# KV for rate limiting
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "placeholder-kv-id"

# Cron trigger for crank (every 5 minutes)
[triggers]
crons = ["*/5 * * * *"]
