[package]
name = "quest"
version = "0.1.0"
description = "QUEST - Social challenge protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "quest"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.0", features = ["init-if-needed"] }
anchor-spl = "0.31.0"
